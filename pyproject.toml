[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-tabred"
version = "0.1.0"
description = "Clinical TabReD Lite: tabular ML benchmark under temporal shift on NHANES"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (skipped unless --run-network is given)"]
