# Clinical TabReD Lite: the single configuration file for the whole project.
# All code reads its settings from this dictionary; nothing is hardcoded elsewhere.

project:
  course: "CSCI 447 Machine Learning: Theory and Practice"
  semester: "Fall 2026"
  project_id: "P034"
  notebook_name: "CSCI447P034.ipynb"
  title: "Clinical TabReD Lite"
  full_title: "Evaluating Tabular Machine Learning Models under Temporal Distribution Shift in Healthcare Data"
  students:
    - {name: "STUDENT_NAME_1", id: "STUDENT_ID_1"}
    - {name: "STUDENT_NAME_2", id: "STUDENT_ID_2"}
  instructor: "Dr. Hari Mohan Rai, Assistant Professor, Department of Computer Science, SCAI, Nazarbayev University"

seed: 42
n_jobs: 4

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  results_dir: results
  figures_dir: figures

# NHANES cycles in chronological order. The suffix is the letter used in file names.
cycles:
  - {name: "2011-2012", suffix: "G", start_year: 2011, end_year: 2012}
  - {name: "2013-2014", suffix: "H", start_year: 2013, end_year: 2014}
  - {name: "2015-2016", suffix: "I", start_year: 2015, end_year: 2016}

download:
  components: [DEMO, BMX, DIQ]
  primary_url: "https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/{start_year}/DataFiles/{component}_{suffix}.xpt"
  fallback_url: "https://wwwn.cdc.gov/Nchs/Nhanes/{start_year}-{end_year}/{component}_{suffix}.XPT"
  timeout_s: 60
  retries: 3
  user_agent: "Mozilla/5.0 (educational research script; clinical-tabred-lite)"

data:
  min_age: 20
  target_column: DIQ010
  positive_code: 1
  negative_code: 2
  numeric_features: [RIDAGEYR, INDFMPIR, BMXBMI, BMXWAIST, BMXHT, BMXWT]
  categorical_features: [RIAGENDR, RIDRETH3, DMDEDUC2]
  # Codes that mean "refused" / "don't know" and must become missing values.
  special_missing_codes:
    DMDEDUC2: [7, 9]
  # Columns kept for description only (never used as model inputs).
  metadata_columns: [SEQN, cycle, WTINT2YR]
  feature_groups:
    demographic: [RIDAGEYR, RIAGENDR, RIDRETH3]
    socioeconomic: [DMDEDUC2, INDFMPIR]
    anthropometric: [BMXBMI, BMXWAIST, BMXHT, BMXWT]
  prevalence_bounds: [0.05, 0.25]

protocols:
  temporal: {train: "2011-2012", val: "2013-2014", test: "2015-2016"}
  in_period: {holdout_fraction: 0.2}
  random: {train: 0.70, val: 0.15, test: 0.15, seeds: [42, 43, 44, 45, 46]}

cv:
  n_splits: 5

bootstrap:
  n_resamples: 1000
  confidence: 0.95

mlp_training:
  max_epochs: 200
  patience: 10

# Small predefined hyperparameter grids. Every combination is tried and
# the best one is chosen by validation PR-AUC (ROC-AUC breaks ties).
models:
  logreg:
    C: [0.01, 0.1, 1.0, 10.0]
  random_forest:
    n_estimators: [300]
    max_depth: [6, 10, null]
    min_samples_leaf: [1, 10]
  xgboost:
    n_estimators: [300]
    learning_rate: [0.03, 0.1]
    max_depth: [3, 5]
    subsample: [0.8]
  lightgbm:
    n_estimators: [300]
    learning_rate: [0.03, 0.1]
    num_leaves: [7, 31]
  mlp:
    hidden_layer_sizes: [[64], [64, 32]]
    alpha: [0.0001, 0.01]

# Settings used by --quick (smoke test on a small subset).
quick:
  rows_per_cycle: 800
  n_resamples: 50
  random_seeds: [42]
  max_epochs: 15
