# Clinical TabReD: shared settings of the benchmark (scripts/run_benchmark.py, run_cv.py,
# analyze_drift.py, summarize_benchmarks.py) and of the notebook. Dataset definitions (periods,
# splits) are in DATASETS in scripts/run_benchmark.py.

project:
  course: "CSCI 447 Machine Learning: Theory and Practice"
  semester: "Fall 2026"
  project_id: "P034"
  notebook_name: "CSCI447P034.ipynb"
  title: "Clinical TabReD"
  full_title: "Evaluating Tabular Machine Learning Models under Temporal Distribution Shift in Healthcare Data"
  students:
    - {name: "Nurbek Baktygali", id: "202127847"}
    - {name: "Yelzhan Rakhimzhanov", id: "202197093"}
  instructor: "Dr. Hari Mohan Rai, Assistant Professor, Department of Computer Science, SCAI, Nazarbayev University"

seed: 42
cv:
  n_splits: 5

bootstrap:
  n_resamples: 1000
  confidence: 0.95

mlp_training:
  max_epochs: 200
  patience: 10

# Small predefined hyperparameter grids. Every combination is tried and
# the best one is chosen by validation PR-AUC (ROC-AUC breaks ties).
models:
  logreg:
    C: [0.01, 0.1, 1.0, 10.0]
  random_forest:
    n_estimators: [300]
    max_depth: [6, 10, null]
    min_samples_leaf: [1, 10]
  xgboost:
    n_estimators: [300]
    learning_rate: [0.03, 0.1]
    max_depth: [3, 5]
    subsample: [0.8]
  lightgbm:
    n_estimators: [300]
    learning_rate: [0.03, 0.1]
    num_leaves: [7, 31]
  mlp:
    hidden_layer_sizes: [[64], [64, 32]]
    alpha: [0.0001, 0.01]
